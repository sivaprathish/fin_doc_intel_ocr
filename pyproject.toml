[project]
name = "financial-document-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sivaprathish", email = "sivaprathishsiva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "flask>=3.1,<4",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "numpy>=2.3.5",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.32",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
    "waitress>=3,<4",
]

[project.scripts]
financial-document-intelligence = "financial_document_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
